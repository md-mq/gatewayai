[project]
name = "gatewayai"
version = "0.1.0"
description = "Unified LLM provider abstraction — stream as the only primitive, typed EventStream, multi-provider adapters, and gateway client."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache 2.0"
authors = [{ name = "Polyaxon", email = "mourad.mourafiq@gmail.com" }]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27.0",
]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/polyaxon/gatewayai"
Repository = "https://github.com/polyaxon/gatewayai"

[project.optional-dependencies]
anthropic = ["anthropic>=0.83.0"]
bedrock = ["anthropic[bedrock]>=0.83.0"]
vertex = ["anthropic[vertex]>=0.83.0"]
openai = ["openai>=1.99.0"]
azure = ["openai>=1.99.0"]
google = ["google-genai"]
server = ["django>=4.2"]
all = [
    "gatewayai[anthropic]",
    "gatewayai[bedrock]",
    "gatewayai[vertex]",
    "gatewayai[openai]",
    "gatewayai[azure]",
    "gatewayai[google]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock>=3.14.0",
    "ruff==0.9.2",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
isort = { combine-as-imports = true, known-first-party = ["gatewayai"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
